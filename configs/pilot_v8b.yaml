# =============================================================================
# Phase 2 Pilot v8b — LiteQP-CNN DIRECT mode (end-to-end, no A+ prior)
# =============================================================================
# AB-test arm B. M0 anchor vs M4 = LiteQP-CNN (direct mode, no A+ prior).
# See PROJECT_STATE §7.15 / phase3_liteqp_cnn_direct.yaml for design.
#
# Compared with pilot_v8a, the ONLY difference is whether the analytic
# A+ prior is added at inference. Same training data, same architecture,
# same λ. The ablation gap pilot_v8b − pilot_v8a measures the value of
# the analytic prior in this setting.
#
# Run sequence:
#   PYTHONPATH=src python phase2/scripts/run_phase3_liteqp_pipeline.py \
#       --config phase2/configs/phase3_liteqp_cnn_direct.yaml --start-step 3
#   bash scripts/run_pilot.sh configs/pilot_v8b.yaml
# =============================================================================

experiment_id: "pilot_v8b"
output_dir: "~/Minh/ipf/phase2_outputs"
log_level: "INFO"

vtm:
  encoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/EncoderAppStatic"
  decoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/DecoderAppStatic"
  encoder_cfg: "~/Minh/ipf/vtm/VVCSoftware_VTM/cfg/encoder_lowdelay_vtm.cfg"
  internal_bit_depth: 8
  threads: 1
  timeout_s: 10800

sequences:
  - name: "MOT17-04-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-04-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-04-DPM/img1"

  - name: "MOT17-09-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-09-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-09-DPM/img1"

  - name: "MOT17-02-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-02-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-02-DPM/img1"

encoding:
  qp_points: [27, 32, 37, 42]
  methods: ["M0", "M4"]
  phase1_output_dir: "~/Minh/ipf/phase3_outputs/learned"
  phase1_run_prefix: "liteqp_v5d_"  # ← MUST match version in phase3_liteqp_cnn_direct.yaml

evaluation:
  compute_psnr: true
  compute_ssim: false
  compute_task_accuracy: true
  detector_model: "yolov8n.pt"
  detector_confidence: 0.25
  detector_device: "cuda:0"
  roi_expansion: 0.1
