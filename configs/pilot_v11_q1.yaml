encoding:
  qp_points: [22, 27, 32, 37, 42]
  # M0 anchor (H26x) + classical references + proposed CA-OGIPF.
  # TODO: append a recent (2023-2026) reputable reference once reproduced.
  methods: ["M0", "M1", "M5", "M6", "M4-OG"]
  phase1_output_dir: "~/Minh/ipf/pilot_v11_q1_root"
  phase1_run_prefix: "multi_seq_"

evaluation:
  compute_psnr: true
  compute_ssim: true
  compute_task_accuracy: true
  # Stronger detector to escape saturation; eval runs on cached decoded frames.
  detector_model: "yolov8m.pt"
  detector_confidence: 0.25
  detector_conf_low: 0.001
  detector_classes: [0]
  detector_device: "cuda:0"
  roi_expansion: 0.1
