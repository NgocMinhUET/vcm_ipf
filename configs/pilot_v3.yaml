# =============================================================================
# Phase 2 Pilot v3 — Surrogate-Driven Learned QP Allocation
# =============================================================================
# Compares M0 (uniform anchor) against M4_learned (the Phase 3 best Level
# trained via run_phase3_pipeline.sh).
#
# IMPORTANT — order of operations:
#   1. Run pilot_v1 (or smoke_v5 for the Q_base sweep) so that
#      experiment_summary.json contains M0 bits at the QPs in qp_points.
#   2. Run phase1/scripts/run_lp_ablation.py for the chosen sequences with
#      output.save_field_npy: true so that phase1_outputs_v2/{seq}/M4/fields/
#      contains field_*.npy.
#   3. Run phase2/scripts/run_phase3_pipeline.sh phase2/configs/phase3_fit.yaml
#      to fit Levels 1-6 and emit dQP maps under
#      ~/Minh/ipf/phase3_outputs/learned/learned_{seq}/M4/qp_vtm_delta/
#   4. Run THIS config to encode + evaluate.
#
# Grid: 3 seq × 2 methods × 4 QPs × 50 frames = 24 runs ≈ 14 h on a single GPU.
# =============================================================================

experiment_id: "pilot_v3"
output_dir: "~/Minh/ipf/phase2_outputs"
log_level: "INFO"

vtm:
  encoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/EncoderAppStatic"
  decoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/DecoderAppStatic"
  encoder_cfg: "~/Minh/ipf/vtm/VVCSoftware_VTM/cfg/encoder_lowdelay_vtm.cfg"
  internal_bit_depth: 8
  threads: 1
  timeout_s: 10800

sequences:
  - name: "MOT17-04-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-04-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-04-DPM/img1"

  - name: "MOT17-09-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-09-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-09-DPM/img1"

  - name: "MOT17-02-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-02-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-02-DPM/img1"

encoding:
  qp_points: [27, 32, 37, 42]
  # pilot_v3 = anchor + learned Phase 3 formula (uses M4 slot).
  methods: ["M0", "M4"]
  # learned_{seq}/M4/qp_vtm_delta is produced by run_phase3_pipeline.sh.
  phase1_output_dir: "~/Minh/ipf/phase3_outputs/learned"
  phase1_run_prefix: "learned_"

evaluation:
  compute_psnr: true
  compute_ssim: false
  compute_task_accuracy: true
  detector_model: "yolov8n.pt"
  detector_confidence: 0.25
  detector_device: "cuda:0"
  roi_expansion: 0.1
