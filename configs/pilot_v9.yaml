# =============================================================================
# Phase 2 Pilot v9 — LiteQP-CNN-DIRECT + Q-aware bound (Path F, §7.16)
# =============================================================================
# M0 anchor vs M4 = LiteQP-CNN-direct with Q-aware δ̂ clip. Same trained
# CNN as pilot_v8b, only the inference clipping changes — so the model
# bundle is regenerated bit-identically (deterministic seed=20260506).
#
# Pre-registered hypothesis (PROJECT_STATE §7.16):
#   1. Recover MOT17-09 BD-Rate-Task ≤ −10 %  (currently +2.06 %)
#   2. Maintain MOT17-02 BD-Rate-Task ≤ −15 %  (currently −23.24 %)
#   3. Maintain MOT17-04 BD-Rate-Task ≤ −2 %   (currently −4.70 %)
#   4. Avg BD-Rate-Task ≤ −12 %                 (currently −8.63 %)
#
# Run sequence on server (~14 h total encode):
#   PYTHONPATH=src python scripts/run_phase3_liteqp_pipeline.py \
#       --config configs/phase3_liteqp_cnn_direct_qaware.yaml --start-step 3
#   bash scripts/run_pilot.sh configs/pilot_v9.yaml
# =============================================================================

experiment_id: "pilot_v9"
output_dir: "~/Minh/ipf/phase2_outputs"
log_level: "INFO"

vtm:
  encoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/EncoderAppStatic"
  decoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/DecoderAppStatic"
  encoder_cfg: "~/Minh/ipf/vtm/VVCSoftware_VTM/cfg/encoder_lowdelay_vtm.cfg"
  internal_bit_depth: 8
  threads: 1
  timeout_s: 10800

sequences:
  - name: "MOT17-04-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-04-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-04-DPM/img1"

  - name: "MOT17-09-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-09-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-09-DPM/img1"

  - name: "MOT17-02-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-02-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-02-DPM/img1"

encoding:
  qp_points: [27, 32, 37, 42]
  methods: ["M0", "M4"]
  phase1_output_dir: "~/Minh/ipf/phase3_outputs/learned"
  phase1_run_prefix: "liteqp_v5dq_"  # ← MUST match version in phase3_liteqp_cnn_direct_qaware.yaml

evaluation:
  compute_psnr: true
  compute_ssim: false
  compute_task_accuracy: true
  detector_model: "yolov8n.pt"
  detector_confidence: 0.25
  detector_device: "cuda:0"
  roi_expansion: 0.1
