# =============================================================================
# Phase 2 Pilot v6 — LiteQP v3 (auto-λ from M0 elasticity)
# =============================================================================
# Compares M0 (uniform anchor) against M4 = LiteQP v3 (auto-λ; see
# PROJECT_STATE §7.12). Tests whether replacing manual per-sequence λ tuning
# with a closed-form data-driven estimator recovers (or beats) pilot_v4
# without re-introducing v5's failure mode.
#
# Pre-requisite directory layout (must already exist on the server):
#   ~/Minh/ipf/phase3_outputs/learned/liteqp_v3_<seq>/M4/qp_vtm_delta_QP{27,32,37,42}/
#
# Produced by:
#   PYTHONPATH=src python phase2/scripts/run_phase3_liteqp_pipeline.py \
#       --config phase2/configs/phase3_liteqp_v3.yaml --start-step 3
#
# (Steps 1-2 are skipped automatically because they share saliency / rate
# caches with pilot_v4.)
#
# Grid: 3 seq × 2 methods × 4 QPs × 50 frames = 24 runs ≈ 14 h on a single GPU.
#
# Pre-registered success criteria (PROJECT_STATE §7.12):
#   (a) AVERAGE BD-Rate-Task ≤ pilot_v4 (currently −8.60 %): equal-or-better
#       — proves auto-λ does not regress.
#   (b) Per-(seq, QP) cell tally vs heuristics M1/M5/M6 ≥ 4/9 — at least
#       holds the per-cell ground from pilot_v5.
#   (c) Stretch goal: MOT17-09 BD-Rate-Task ≤ −15 % (would beat M6's −39 %
#       outlier requires further work — this is intentionally MODEST so we
#       do not bias toward another over-aggressive λ).
# =============================================================================

experiment_id: "pilot_v6"
output_dir: "~/Minh/ipf/phase2_outputs"
log_level: "INFO"

vtm:
  encoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/EncoderAppStatic"
  decoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/DecoderAppStatic"
  encoder_cfg: "~/Minh/ipf/vtm/VVCSoftware_VTM/cfg/encoder_lowdelay_vtm.cfg"
  internal_bit_depth: 8
  threads: 1
  timeout_s: 10800

sequences:
  - name: "MOT17-04-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-04-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-04-DPM/img1"

  - name: "MOT17-09-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-09-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-09-DPM/img1"

  - name: "MOT17-02-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-02-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-02-DPM/img1"

encoding:
  qp_points: [27, 32, 37, 42]
  # pilot_v6 = M0 anchor + M4 LiteQP-v3 (auto-λ from M0 elasticity).
  # encode_pipeline._find_qp_maps will pick up qp_vtm_delta_QP{qp}/ per Q_base,
  # under ~/Minh/ipf/phase3_outputs/learned/liteqp_v3_<seq>/M4/.
  methods: ["M0", "M4"]
  phase1_output_dir: "~/Minh/ipf/phase3_outputs/learned"
  phase1_run_prefix: "liteqp_v3_"     # ← prefix change vs pilot_v5 ("liteqp_v2_")

evaluation:
  compute_psnr: true
  compute_ssim: false
  compute_task_accuracy: true
  detector_model: "yolov8n.pt"
  detector_confidence: 0.25
  detector_device: "cuda:0"
  roi_expansion: 0.1
