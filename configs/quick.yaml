# =============================================================================
# Phase 2 QUICK Configuration — representative test before full pilot (~2 h)
# =============================================================================
# Purpose:  After smoke passes, run a grid that gives a REAL BD-Rate curve:
#             - all 5 methods (M0, M1, M4, M5, M6)
#             - 4 QP points spanning the full curve (22, 27, 32, 37)
#             - 10 frames — enough for stable mAP trends without taking all day
#           Confirms BD-Rate computation works BEFORE committing to a 30+ h pilot.
#
# Grid:  1 sequence × 5 methods × 4 QPs × 10 frames = 20 runs
# Estimated wall-clock (with lambda-aware QP map encoding):
#   - QP=27 ~35s/frame  → 350s/run × 5 methods = 1750s  ≈ 29 min
#   - QP=32 ~20s/frame  → 200s/run × 5 methods = 1000s  ≈ 17 min
#   - QP=37 ~15s/frame  → 150s/run × 5 methods =  750s  ≈ 12 min
#   - QP=42  ~8s/frame  →  80s/run × 5 methods =  400s  ≈  7 min
#   - Total ≈ 3900s ≈ 65 min
#
# QP range [27,32,37,42] is chosen deliberately:
#   QP=27-32: map values (22-38) are mostly > base → background saves bits → M4 < M0 bitrate
#   QP=37-42: map ROI (22) >> base → strong ROI protection visible, mAP should improve
#   QP=22 is excluded: very slow (50s/frame) and adds little beyond QP=27
# =============================================================================

experiment_id: "quick_v2"
output_dir: "~/Minh/ipf/phase2_outputs"
log_level: "INFO"

vtm:
  encoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/EncoderAppStatic"
  decoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/DecoderAppStatic"
  encoder_cfg: "~/Minh/ipf/vtm/VVCSoftware_VTM/cfg/encoder_lowdelay_vtm.cfg"
  internal_bit_depth: 8
  threads: 1
  timeout_s: 3600  # 1 hour per run is plenty for 10 frames

sequences:
  - name: "MOT17-04-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-04-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 10
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-04-DPM/img1"

encoding:
  qp_points: [27, 32, 37, 42]
  methods: ["M0", "M1", "M4", "M5", "M6"]
  phase1_output_dir: "~/Minh/ipf/phase1_outputs"
  phase1_run_prefix: "multi_seq_"

evaluation:
  compute_psnr: true
  compute_ssim: false
  compute_task_accuracy: true
  detector_model: "yolov8n.pt"
  detector_confidence: 0.25
  detector_device: "cuda:0"
  roi_expansion: 0.1
