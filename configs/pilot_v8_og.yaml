# =============================================================================
# Phase 2 Pilot v8-OG — M0 vs M4-OG with compression-aware activation
# (PROJECT_STATE §7.20.6)
# =============================================================================
# Key changes vs pilot_v7_og:
#   - Uses phase3_liteqp_og.yaml (restored to floor=1.0, ceil=2.2)
#   - Activation schedule: QP≤32→0, QP=37→0.5, QP=42→1.0 (built into code)
#     replaces the manual floor=0 hack in v7.
#   - Visible dims (original_height=1080) now correctly clip boundary CTU
#     overlap areas (occupancy.py fix).
#   - end_to_end_og_a_plus() used directly; no manual composition.
#   - 50 frames (fixes the 30-frame truncation bug in v7).
# =============================================================================

experiment_id: "pilot_v8_og"
output_dir: "~/Minh/ipf/phase2_outputs"
log_level: "INFO"

vtm:
  encoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/EncoderAppStatic"
  decoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/DecoderAppStatic"
  encoder_cfg:  "~/Minh/ipf/vtm/VVCSoftware_VTM/cfg/encoder_lowdelay_vtm.cfg"
  internal_bit_depth: 8
  threads: 1
  timeout_s: 10800

sequences:
  - name: "MOT17-04-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-04-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-04-DPM/img1"

  - name: "MOT17-09-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-09-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-09-DPM/img1"

  - name: "MOT17-02-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-02-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-02-DPM/img1"

encoding:
  qp_points: [27, 32, 37, 42]
  methods: ["M0", "M4"]
  phase1_output_dir: "~/Minh/ipf/phase3_outputs/learned"
  phase1_run_prefix: "liteqp_og_"   # maps written to liteqp_og_<seq>/M4/

evaluation:
  compute_psnr: true
  compute_ssim: false
  compute_task_accuracy: true
  detector_model: "yolov8n.pt"
  detector_confidence: 0.25
  detector_conf_low: 0.001
  detector_classes: [0]
  detector_device: "cuda:0"
  roi_expansion: 0.1
