# =============================================================================
# Phase 2 SMOKE v5 — Phase 3 dQP calibration verification (~10–15 min)
# =============================================================================
# Purpose:  Verify that the Phase 3 delta-QP pipeline works correctly at ALL
#           four QP points (not just the calibration QP=32).
#           This is the key check that fixes the pilot v1 root cause.
#
# What you MUST see in experiment_summary.json for PASS:
#   1. M0 != M4 bitrate at EVERY QP point (27, 32, 37, 42).
#      At QP=37/42/47, pilot v1 had M4≈M0 → FIXED by dQP.
#   2. M4 mAP50 >= M0 mAP50 at QP=32 (was +0.025 in pilot v1).
#   3. mAP50 > 0 for both methods at all QPs.
#   4. No "QP maps not found" warnings in the log.
#      (If you see them → phase1_output_dir or prefix is wrong.)
#
# Grid:  1 sequence × 2 methods × 4 QPs × 5 frames = 8 runs
# =============================================================================

experiment_id: "smoke_v5"
output_dir: "~/Minh/ipf/phase2_outputs"
log_level: "INFO"

vtm:
  encoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/EncoderAppStatic"
  decoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/DecoderAppStatic"
  encoder_cfg: "~/Minh/ipf/vtm/VVCSoftware_VTM/cfg/encoder_lowdelay_vtm.cfg"
  internal_bit_depth: 8
  threads: 1
  timeout_s: 1800  # 30 min per run is more than enough for 5 frames

sequences:
  - name: "MOT17-04-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-04-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 5
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-04-DPM/img1"

encoding:
  # Four QPs — critical for Phase 3: dQP maps must work correctly at ALL QPs,
  # not just the calibration point (QP=32). smoke_v5 checks this explicitly.
  qp_points: [27, 32, 37, 42]
  # M0 = uniform anchor; M4 = Phase 3 Lp (p=inf) with relative dQP.
  methods: ["M0", "M4"]
  # Phase 3 v2 outputs: Q_base-agnostic delta-QP maps.
  phase1_output_dir: "~/Minh/ipf/phase1_outputs_v2"
  phase1_run_prefix: "ipf_lp_pinf_"

evaluation:
  compute_psnr: true
  compute_ssim: false
  compute_task_accuracy: true
  detector_model: "yolov8n.pt"
  detector_confidence: 0.25
  detector_device: "cuda:0"
  roi_expansion: 0.1
