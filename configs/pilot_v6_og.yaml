# =============================================================================
# Phase 2 Pilot v6-OG — M0 vs M4-OG (Occupancy-Guided IPF, PROJECT_STATE §7.20)
# =============================================================================
# Compares the uniform-anchor M0 against M4 = OG-IPF (analytic-only by
# default; flip apply.mode in phase3_liteqp_og.yaml to og_liteqp for the
# residual variant).
#
# Pre-requisite directory layout (must already exist on the server):
#   ~/Minh/ipf/phase3_outputs/learned/liteqp_og_<seq>/M4/qp_vtm_delta_QP{27,32,37,42}/
#
# Produced by:
#   PYTHONPATH=src python scripts/run_phase3_liteqp_pipeline.py \
#       --config configs/phase3_liteqp_og.yaml
#
# Grid: 3 seq × 2 methods × 4 QPs × 50 frames = 24 runs ≈ 14 h on a single GPU.
# =============================================================================

experiment_id: "pilot_v6_og"
output_dir: "~/Minh/ipf/phase2_outputs"
log_level: "INFO"

vtm:
  encoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/EncoderAppStatic"
  decoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/DecoderAppStatic"
  encoder_cfg:  "~/Minh/ipf/vtm/VVCSoftware_VTM/cfg/encoder_lowdelay_vtm.cfg"
  internal_bit_depth: 8
  threads: 1
  timeout_s: 10800

sequences:
  - name: "MOT17-04-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-04-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-04-DPM/img1"

  - name: "MOT17-09-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-09-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-09-DPM/img1"

  - name: "MOT17-02-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-02-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-02-DPM/img1"

encoding:
  qp_points: [27, 32, 37, 42]
  # M4 maps land in `qp_vtm_delta_QP{n}/` as written by the OG apply step.
  # The encoder will RAISE if those per-QP dirs are missing — the §7.20
  # audit forbids the silent fallback to the generic `qp_vtm_delta/`.
  methods: ["M0", "M4"]
  phase1_output_dir: "~/Minh/ipf/phase3_outputs/learned"
  phase1_run_prefix: "liteqp_og_"

evaluation:
  compute_psnr: true
  compute_ssim: false
  compute_task_accuracy: true
  detector_model: "yolov8n.pt"
  detector_confidence: 0.25
  detector_conf_low: 0.001
  detector_classes: [0]
  detector_device: "cuda:0"
  roi_expansion: 0.1
