# =============================================================================
# IPF Phase 1 — IPF v2 Configuration
# =============================================================================
# Key change from default.yaml: superposition = "max" (based on A4 ablation)
# This eliminates the object-count scaling problem identified in comp_v3:
#   - QP Std: 0.260 (sum) → 0.150 (max), a 42% improvement
#   - Temporal stability competitive with M5 and M6
#   - Spatial smoothness maintained (2.200 → 2.306, acceptable)
# =============================================================================

run_id: "run_001"
video_path: ""
output_dir: "~/ipf_outputs"
max_frames: null
log_level: "INFO"

detector:
  model_name: "yolov8n.pt"
  confidence_threshold: 0.25
  iou_threshold: 0.45
  device: "cuda:0"
  img_size: 640
  classes: null

tracker:
  tracker_type: "bytetrack"
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  track_buffer: 30
  match_thresh: 0.8

mass:
  use_class_priority: true
  use_track_age: true
  age_warmup_frames: 5
  class_priorities:
    person: 1.0
    car: 1.0
    truck: 0.9
    bus: 0.9
    motorcycle: 0.8
    bicycle: 0.8

field:
  beta: 2.0
  eps_d: 0.001
  eps_k: 1.0
  alpha_w: 0.75
  alpha_h: 0.75
  superposition: "max"           # ← KEY CHANGE: max instead of sum

normalization:
  rho: 0.95
  percentile_low: 5.0
  percentile_high: 95.0
  eps_n: 0.00000001

qp_mapping:
  qp_base: 32
  delta_roi: 10.0
  delta_bg: 6.0
  gamma_roi: 1.0
  gamma_bg: 1.0
  mu: 0.3

bounded_dynamics:
  eta: 0.7
  delta_slew: 3.0
  qp_min: 10
  qp_max: 51

baselines:
  m5_sigma_factor: 0.75
  m6_alpha: 0.8
  m7_cutoff_factor: 0.5
  m8_blur_factor: 0.4

ablation:
  enabled: false
  variants:
    - A1
    - A3
    - A4
    - A6
    - M2
    - M3

ctu:
  ctu_size: 128

viz:
  save_field_maps: true
  save_qp_overlays: true
  save_object_overlays: true
  colormap: "jet"
  overlay_alpha: 0.4
  dpi: 100
  save_every_n_frames: 1

output:
  save_object_states: true
  save_field_npy: false
  save_qp_csv: true
  save_qp_vtm: true
  save_summary_json: true
  save_frame_summaries: true
