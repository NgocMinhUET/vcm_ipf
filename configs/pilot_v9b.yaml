# =============================================================================
# Phase 2 Pilot v9b — LiteQP-CNN-DIRECT + Q-aware clip (QP=27 ONLY, Path F-tuned)
# =============================================================================
# M0 anchor vs M4 = LiteQP-CNN-direct + Q-aware bound (QP=27-only schedule).
# See PROJECT_STATE §7.17 / phase3_liteqp_cnn_direct_qaware_v2.yaml.
#
# Diff vs pilot_v9:
#   pilot_v9  schedule: ±1.50 / ±2.00 / ±2.50 / ±3.00 → tightened EVERY QP
#   pilot_v9b schedule: ±1.50 / ±8.00 / ±8.00 / ±8.00 → tightens ONLY QP=27
#
# Pre-registered hypothesis (PROJECT_STATE §7.17):
#   1. MOT17-09 BD-Rate-Task ≤ −10 % (currently −13.11 % in v9 — keep this)
#   2. MOT17-02 BD-Rate-Task ≤ −15 % (currently +18.73 % in v9 — restore v8b's −23.24 %)
#   3. MOT17-04 BD-Rate-Task ≤ −2 %  (currently +17.14 % in v9 — restore v8b's −4.70 %)
#   4. Avg BD-Rate-Task ≤ −12 %       (currently +7.58 % in v9; v8b had −8.63 %)
#
# Run sequence on server (~14 h encode):
#   PYTHONPATH=src python scripts/run_phase3_liteqp_pipeline.py \
#       --config configs/phase3_liteqp_cnn_direct_qaware_v2.yaml --start-step 3
#   bash scripts/run_pilot.sh configs/pilot_v9b.yaml
# =============================================================================

experiment_id: "pilot_v9b"
output_dir: "~/Minh/ipf/phase2_outputs"
log_level: "INFO"

vtm:
  encoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/EncoderAppStatic"
  decoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/DecoderAppStatic"
  encoder_cfg: "~/Minh/ipf/vtm/VVCSoftware_VTM/cfg/encoder_lowdelay_vtm.cfg"
  internal_bit_depth: 8
  threads: 1
  timeout_s: 10800

sequences:
  - name: "MOT17-04-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-04-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-04-DPM/img1"

  - name: "MOT17-09-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-09-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-09-DPM/img1"

  - name: "MOT17-02-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-02-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-02-DPM/img1"

encoding:
  qp_points: [27, 32, 37, 42]
  methods: ["M0", "M4"]
  phase1_output_dir: "~/Minh/ipf/phase3_outputs/learned"
  phase1_run_prefix: "liteqp_v5dq2_"  # ← MUST match version in phase3_liteqp_cnn_direct_qaware_v2.yaml

evaluation:
  compute_psnr: true
  compute_ssim: false
  compute_task_accuracy: true
  detector_model: "yolov8n.pt"
  detector_confidence: 0.25
  detector_device: "cuda:0"
  roi_expansion: 0.1
