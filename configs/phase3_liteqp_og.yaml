# =============================================================================
# Phase 3 Stage C — OG-IPF analytic + (optional) MLP residual.
# =============================================================================
# Drives `phase2/scripts/run_phase3_liteqp_pipeline.py` in OG mode
# (PROJECT_STATE §7.20 — Occupancy-Guided IPF).
#
# Two pilots are supported by toggling ``apply.mode``:
#
#   apply.mode: "og_a_plus"   → analytic-only, no MLP. Uses U_c + (★).
#   apply.mode: "og_liteqp"   → analytic + MLP residual on U_c features.
#
# In OG modes the orchestrator additionally:
#   * runs `phase2.phase3.save_boxes` to persist per-frame YOLO boxes
#     into the same directory as ``phi_oracle_*.npy``;
#   * wires ``--boxes-dir`` and the OG hyper-parameters into the apply step;
#   * writes per-frame OG diagnostics JSON + a summary CSV next to the
#     delta maps (PROJECT_STATE §7.20 / §9 of the user spec).
# =============================================================================

output_root: "~/Minh/ipf/phase3_outputs"

# Versioning: keeps OG outputs separate from pilot_v4 (LiteQP) artefacts.
version: "og"          # → oracle_liteqp_og/ , liteqp_og_<seq>/ ...

pilot_summary: "~/Minh/ipf/phase2_outputs/pilot_v1/experiment_summary.json"

qp_list:        [27, 32, 37, 42]
delta_list:     [-8, -6, -4, -2, 0, 2, 4]
residual_bound: 2.0     # cap on |MLP residual| in og_liteqp mode

sequences:
  - name: "MOT17-04-DPM"
    width: 1920
    height: 1152
    n_frames: 50
    fps: 30
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-04-DPM/img1"

  - name: "MOT17-09-DPM"
    width: 1920
    height: 1152
    n_frames: 50
    fps: 30
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-09-DPM/img1"

  - name: "MOT17-02-DPM"
    width: 1920
    height: 1152
    n_frames: 50
    fps: 30
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-02-DPM/img1"

# ── Step 1 — saliency + box persistence ──────────────────────────────────────
saliency:
  ctu_size: 128
  blur_sigma: 8.0
  batch_size: 32
  detector: "yolov8n.pt"      # also used by save_boxes for box JSON files
  confidence: 0.25
  device: "cuda:0"

# ── Step 3 — teacher Lagrangian (used only when apply.mode = og_liteqp) ──────
teacher:
  lambda_task:   5.0
  lambda_anchor: 0.6
  eta:           0.06
  xi:            0.15

teacher_overrides: {}

# ── Action 4 — automatic per-sequence λ_task ─────────────────────────────────
# Mandatory in OG to avoid the v5 cherry-picking critique. The MLP-only
# variant (og_liteqp) consumes the resulting per-sequence λ; the analytic
# variant (og_a_plus) ignores it but the metadata is still produced for
# reproducibility.
auto_lambda:
  enabled:     true
  source:      "~/Minh/ipf/phase2_outputs/pilot_v1/experiment_summary.json"
  base_lambda: 5.0
  alpha:       0.5
  lambda_min:  3.5
  lambda_max:  7.0
  slope_mode:  "median"

# ── Step 5 — MLP training (only used in og_liteqp mode) ──────────────────────
train:
  cv: "both"
  max_iter: 400
  seed: 20260508
  n_bootstrap: 500
  bootstrap_alpha: 0.05

# ── Step 6 — apply OG-IPF to generate dQP maps ───────────────────────────────
apply:
  # OG_A_PLUS = analytic-only. Recommended starting point — pure formula,
  # no learned component, easiest to defend with reviewers.
  mode: "og_a_plus"

  # Q-aware residual bound is OPT-IN. Keep OFF on first pilot so any
  # observed gain is attributable to OG-IPF, not to the residual schedule.
  q_aware_bound:
    enabled: false
    slope: 0.04
    lo: 1.4
    hi: 2.2

# ── OG-IPF hyper-parameters (PROJECT_STATE §7.20) ────────────────────────────
og:
  detector_classes: [0]   # COCO IDs to keep in box JSONs (0 = person)
  lambda_ctu: 0.4
  lambda_obj: 0.6
  gamma:      0.0         # 0 = ignore object size in priority (reviewer-safe)
  alpha_in:   1.0         # weight on occupancy gate G_c
  alpha_ctx:  0.3         # weight on context (1-G)·D
  aggregator: "max"       # robust for dense MOT scenes; alternatives: "lp"
  p_norm:     4.0
  min_protection:
    floor: 1.0   # δ_min(Q_b=27)
    ceil:  2.2   # δ_min(Q_b=42) at most
    slope: 0.08  # δ_min(Q_b) = clip(floor + slope·(Q_b - 27), floor, ceil)
    eta:   0.7   # exponent on G_c^η in the constraint δ_c ≤ -δ_min·G^η
    g_min_protect: 0.10  # CTUs with G ≤ this skip the hard cap (kept at
                         # +bg_bound) so the rate-neutral projection has
                         # slack to balance the per-CTU sum even at QP=42
                         # on dense scenes (PROJECT_STATE §7.20.3 fix).
