# =============================================================================
# Phase 2 Pilot Experiment Configuration
# =============================================================================
# Pilot grid for initial VTM encoding experiments.
# Uses 4 QP points x 5 methods x 3 sequences = 60 encoding runs.
#
# Aligned with 04_EXPERIMENT_MATRIX.md section C.1 (Pilot Grid).
#
# n_frames=50 is chosen for speed:
#   - 50 frames at QP=22 (1920x1152) ≈ 30 min/run vs. 2+ hrs at 200 frames.
#   - 50 frames is sufficient for stable BD-Rate RD points (standard practice
#     in VCM literature when time-constrained).
#   - Total wall-time estimate: 60 runs × ~20 min avg ≈ 20 h on a single CPU.
# =============================================================================

experiment_id: "pilot_v1"
output_dir: "~/Minh/ipf/phase2_outputs"
log_level: "INFO"

vtm:
  # VTM cmake places binaries under VTM_DIR/bin/umake/<gcc-version>/<arch>/release/
  # (NOT under build/bin — the output dir is relative to the VTM source root)
  # Confirmed path on server: ~/Minh/ipf/vtm/VVCSoftware_VTM/bin/umake/gcc-11.4/x86_64/release/
  encoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/umake/gcc-11.4/x86_64/release/EncoderApp"
  decoder_path: "~/Minh/ipf/vtm/VVCSoftware_VTM/bin/umake/gcc-11.4/x86_64/release/DecoderApp"
  encoder_cfg: "~/Minh/ipf/vtm/VVCSoftware_VTM/cfg/encoder_lowdelay_vtm.cfg"
  internal_bit_depth: 8
  threads: 1
  # Per-run timeout budget.  Adaptive formula in vtm_encoder.py also applies
  # (max(3600, n_frames × 90 s/frame)), so this acts as an explicit ceiling.
  timeout_s: 10800  # 3 hours — enough for QP=22, 50 frames with 6× headroom

sequences:
  # Height is CTU-128 aligned: ceil(1080/128)*128 = 1152
  # frames_to_yuv.sh pads with black to reach this size.
  - name: "MOT17-04-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-04-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-04-DPM/img1"

  - name: "MOT17-02-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-02-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-02-DPM/img1"

  - name: "MOT17-09-DPM"
    yuv_path: "~/Minh/ipf/datasets/yuv/MOT17-09-DPM.yuv"
    width: 1920
    height: 1152
    original_width: 1920
    original_height: 1080
    fps: 30
    n_frames: 50
    frames_dir: "~/Minh/ipf/datasets/MOT17/MOT17/train/MOT17-09-DPM/img1"

encoding:
  qp_points: [22, 27, 32, 37]
  methods: ["M0", "M1", "M4", "M5", "M6"]
  phase1_output_dir: "~/ipf_outputs"
  phase1_run_prefix: "multi_seq_"

evaluation:
  compute_psnr: true
  compute_ssim: false
  compute_task_accuracy: true
  detector_model: "yolov8n.pt"
  detector_confidence: 0.25
  detector_device: "cuda:0"
  roi_expansion: 0.1
